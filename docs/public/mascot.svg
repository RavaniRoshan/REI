<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- body -->
  <rect x="50" y="60" width="100" height="80" rx="16" fill="url(#bodyGrad)" filter="url(#glow)"/>
  <!-- head -->
  <rect x="60" y="20" width="80" height="50" rx="14" fill="url(#bodyGrad)" filter="url(#glow)"/>
  <!-- antenna -->
  <line x1="100" y1="20" x2="100" y2="6" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="4" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <!-- left eye -->
  <circle cx="82" cy="42" r="10" fill="#1e1b4b"/>
  <circle cx="82" cy="42" r="6" fill="url(#eyeGrad)" filter="url(#glow)"/>
  <circle cx="84" cy="40" r="2" fill="#fff"/>
  <!-- right eye -->
  <circle cx="118" cy="42" r="10" fill="#1e1b4b"/>
  <circle cx="118" cy="42" r="6" fill="url(#eyeGrad)" filter="url(#glow)"/>
  <circle cx="120" cy="40" r="2" fill="#fff"/>
  <!-- mouth -->
  <path d="M88 55 Q100 63 112 55" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <!-- left arm -->
  <rect x="30" y="70" width="20" height="10" rx="5" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="28" cy="75" r="8" fill="url(#bodyGrad)" filter="url(#glow)"/>
  <!-- right arm - holding magnifying glass -->
  <rect x="150" y="70" width="20" height="10" rx="5" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="178" cy="65" r="14" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow)"/>
  <line x1="163" y1="75" x2="150" y2="75" stroke="#8b5cf6" stroke-width="3"/>
  <!-- magnifying glass lens shimmer -->
  <circle cx="178" cy="65" r="8" fill="#06b6d4" opacity="0.15"/>
  <!-- feet -->
  <rect x="65" y="140" width="25" height="10" rx="5" fill="#8b5cf6" filter="url(#glow)"/>
  <rect x="110" y="140" width="25" height="10" rx="5" fill="#8b5cf6" filter="url(#glow)"/>
  <!-- chest code symbol -->
  <text x="100" y="108" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#06b6d4" filter="url(#glow)">&lt;/&gt;</text>
  <!-- sparkles -->
  <circle cx="170" cy="30" r="2" fill="#22d3ee" opacity="0.8"/>
  <circle cx="30" cy="50" r="1.5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="185" cy="90" r="2" fill="#06b6d4" opacity="0.6"/>
  <circle cx="15" cy="110" r="1.5" fill="#8b5cf6" opacity="0.5"/>
</svg>
