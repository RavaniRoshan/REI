[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rei"
version = "0.1.0"
description = "Repository Evolution Intelligence — predict downstream impact of code changes"
requires-python = ">=3.11"
dependencies = [
    "gitpython",
    "networkx",
    "click",
]

[project.scripts]
rei = "rei.cli:cli"

[tool.setuptools.packages.find]
include = ["rei*"]
